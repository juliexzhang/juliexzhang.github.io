  // ════════════════════════════════════════════════════
  // Rendering — no need to edit below this line.
  // ════════════════════════════════════════════════════

  // Minimal camera SVG icon (injected next to date for photo entries)
  const CAMERA_SVG = `<svg class="update-camera-icon" xmlns="http://www.w3.org/2000/svg"
    width="13" height="13" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
    aria-label="Photo available">
    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
    <circle cx="12" cy="13" r="4"/>
  </svg>`;

  const timeline = document.getElementById('updates-timeline');

  if (timeline) {
    if (updates.length === 0) {
      timeline.innerHTML = '<p class="empty-state">Updates coming soon.</p>';
    } else {

      // ── Floating Polaroid-style tooltip ───────────
      const tooltip = document.createElement('div');
      tooltip.className = 'image-tooltip';
      tooltip.innerHTML = `
        <img id="tooltip-img" src="" alt="" />
        <div class="image-tooltip-caption" id="tooltip-caption"></div>
      `;
      document.body.appendChild(tooltip);

      const tooltipImg = document.getElementById('tooltip-img');
      const tooltipCap = document.getElementById('tooltip-caption');

      // ── Group entries by year ──────────────────────
      function extractYear(dateStr) {
        const m = dateStr.match(/\b(20\d{2})\b/);
        return m ? m[1] : '—';
      }

      let currentYear = null;
      let animIdx     = 0;

      updates.forEach((item) => {
        const year = extractYear(item.date);

        // Year separator
        if (year !== currentYear) {
          currentYear = year;
          const yearRow = document.createElement('div');
          yearRow.className = 'timeline-year-row';
          yearRow.innerHTML = `
            <span class="timeline-year-label">${year}</span>
            <div class="timeline-year-line"></div>
          `;
          timeline.appendChild(yearRow);
        }

        // ── Entry ────────────────────────────────────
        const hasImage = Boolean(item.image);
        const el = document.createElement('div');
        el.className = 'update-item' + (hasImage ? ' has-image' : '');
        el.style.animationDelay = (animIdx * 0.05) + 's';
        animIdx++;

        // Date row — camera icon appended if photo exists
        el.innerHTML = `
          <div class="update-date">
            ${item.date}
            ${hasImage ? CAMERA_SVG : ''}
          </div>
          <p class="update-text">${item.text}</p>
        `;

        // ── Image hover on the date (or whole row) ───
        if (hasImage) {
          const dateEl = el.querySelector('.update-date');

          function showTooltip(e) {
            tooltipImg.src         = item.image;
            tooltipCap.textContent = item.imageCaption || '';
            tooltipCap.style.display = item.imageCaption ? 'flex' : 'none';
            tooltip.classList.add('visible');
            positionTooltip(e);
          }

          function positionTooltip(e) {
            const x = Math.min(e.clientX + 28, window.innerWidth  - 250);
            const y = Math.max(e.clientY - 210, 10);
            tooltip.style.left = x + 'px';
            tooltip.style.top  = y + 'px';
          }

          dateEl.addEventListener('mouseenter', showTooltip);
          dateEl.addEventListener('mousemove',  positionTooltip);
          dateEl.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
        }

        timeline.appendChild(el);
      });
    }
  }

  </script>
