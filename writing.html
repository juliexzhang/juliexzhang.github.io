</head>
<body>

  <!-- ─── NAVBAR ──────────────────────────────────────── -->

  <div class="page-wrapper">

    <!-- ─── PAGE HEADER ─────────────────────────────── -->

      <a class="back-link" href="./index.html">← Home</a>
      <p class="page-header-label">Writing</p>
      <!-- ✏️ Edit the title and description below -->

      <p class="page-header-desc">

    <!-- Writing grid (auto-rendered from the writings array below) -->
    <div class="writing-grid" id="writing-grid"></div>

    </div>
  </footer>

  <!-- ════════════════════════════════════════════════════
       ✏️  ADD OR EDIT YOUR WRITTEN WORK HERE
       ════════════════════════════════════════════════════

  Each object in the array is one card. Fields:
    title    (required) – Title of the piece
    venue    (optional) – Publication or where it appeared; "" to hide
    date     (optional) – When it was published, e.g. "October 2025"; "" to hide
    excerpt  (optional) – A short teaser sentence or two; "" to hide
    image    (optional) – Path to a cover photo, e.g. "./assets/images/cover.jpg"
                          Leave "" to show a styled placeholder instead.
    link     (optional) – URL to read the full piece; "" to make card non-clickable

  HOW TO ADD A NEW PIECE:
    1. Copy one block (from { to },).
    2. Paste it at the TOP of the array (newest first).
    3. Fill in your values and save.
  ════════════════════════════════════════════════════ -->
  <script>

  const writings = [

    // ← ADD YOUR WRITING PIECES HERE. Example:
    // {
    //   title: "Why AI Agents Need Fiduciary Duties",
    //   venue: "Stanford Daily",
    //   date: "November 2025",
    //   excerpt: "As AI systems gain the ability to act autonomously on our behalf, the legal frameworks governing trust relationships must evolve.",
    //   image: "",
    //   link: "https://stanforddaily.com/..."
    // },

  ];

  // ════════════════════════════════════════════════════
  // Rendering — no need to edit below this line.
  // ════════════════════════════════════════════════════
  const grid = document.getElementById('writing-grid');
  if (grid) {
    if (writings.length === 0) {
      grid.innerHTML = '<p class="empty-state">Writing coming soon.</p>';
    } else {
      writings.forEach((item) => {
        const isLinked = item.link && item.link.trim() !== '';
        const el = document.createElement(isLinked ? 'a' : 'div');
        el.className = 'writing-card';

        if (isLinked) {
          el.href   = item.link;
          el.target = '_blank';
          el.rel    = 'noopener';
        }

        // Cover image or placeholder
        const coverHtml = item.image
          ? `<img class="writing-card-cover" src="${item.image}" alt="${item.title}" />`
          : `<div class="writing-card-placeholder">✦</div>`;

        // Meta line: venue · date
        const metaParts = [item.venue, item.date].filter(Boolean);
        const metaHtml  = metaParts.length
          ? `<p class="writing-card-meta">${metaParts.join(' &middot; ')}</p>`
          : '';

        const excerptHtml = item.excerpt
          ? `<p class="writing-card-excerpt">${item.excerpt}</p>`
          : '';

        const linkHtml = isLinked
          ? `<span class="writing-card-link">Read more ↗</span>`
          : '';

        el.innerHTML = `
          ${coverHtml}
          <div class="writing-card-body">
            ${metaHtml}
            <h3 class="writing-card-title">${item.title}</h3>
            ${excerptHtml}
            ${linkHtml}
          </div>
        `;

        grid.appendChild(el);
      });
    }
  }

  </script>

</body>
</html>
